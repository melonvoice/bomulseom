<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>아빠의 비밀 보물섬</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet"><style id="app-style">
:root{--bg:#FFF8EE;--ink:#2F2A44;--muted:#7A7390;--card:#fff;--line:#EFE6D8;--kor:#F2675A;--math:#3F82F0;--sci:#1FA673;--write:#8E5CEB;--eng:#0E9AA7;--good:#1FA673;--mid:#EE9A12;--low:#E9506A;--shadow:0 6px 20px rgba(60,40,20,.07)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3,h4,.jua,button{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
button{cursor:pointer;border:0;font-size:16px;color:inherit;background:none}
button[disabled]{opacity:.4;cursor:default}
a{color:#2f62a3}
.top{position:sticky;top:0;z-index:5;background:rgba(255,248,238,.93);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-family:Jua;font-size:21px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{padding:8px 12px;border-radius:12px;color:var(--muted)}
.nav button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.badge{font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:#fff;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
.hero{margin:6px 0 20px}
.hero h1{font-size:30px;margin:2px 0 0;line-height:1.3}
.hero p{margin:6px 0 0;color:var(--muted);max-width:640px}
.kicker{font-size:13px;letter-spacing:.03em;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.addk{border:2px dashed #E3D6C2;background:transparent;box-shadow:none;font-size:20px;color:var(--muted);min-height:160px}
.kid{display:flex;flex-direction:column;gap:14px}
.kid-h{display:flex;align-items:center;gap:12px}
.ava{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:#FFEFD6;flex:none}
.kid-h h2{margin:0;font-size:25px;line-height:1.2}
.lv{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;background:var(--ink);color:#fff;font-size:17px;line-height:1.2}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.ghost{background:transparent;color:var(--muted);padding:8px 10px}
.btn.sm{padding:8px 12px;font-size:15px;border-radius:11px}
.btn.col{background:var(--c);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:13px;background:#F5EFE6}
.subj-kor{--c:var(--kor)}.subj-math{--c:var(--math)}.subj-sci{--c:var(--sci)}.subj-write{--c:var(--write)}.subj-eng{--c:var(--eng)}
.stile{border-radius:20px;padding:18px;background:#fff;border:2px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .12s,border-color .12s;width:100%}
.stile:hover{transform:translateY(-2px);border-color:var(--c)}
.stile .ic{font-size:34px;line-height:1}
.stile .nm{font-family:Jua;font-size:22px;color:var(--c)}
.stile .ds{font-size:14px;color:var(--muted);font-family:'Gowun Dodum'}
.stile.done{background:color-mix(in srgb,var(--c) 9%,#fff);border-color:var(--c)}
.stile .ck{position:absolute;top:14px;right:16px;font-family:Jua;color:var(--c);font-size:17px}
.bar{height:10px;border-radius:99px;background:#F1EAE0;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--ink));transition:width .3s}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .r{display:grid;grid-template-columns:76px 1fr 42px;gap:8px;align-items:center;font-size:14px}
.mini .r span:last-child{text-align:right;color:var(--muted)}
.run{max-width:760px;margin:0 auto}
.run-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.run-top .bar{flex:1;height:14px}
.qcard{background:#fff;border-radius:28px;padding:26px 24px;box-shadow:var(--shadow);border:3px solid color-mix(in srgb,var(--c) 28%,#fff)}
.qnum{font-family:Jua;color:var(--c);font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qtext{font-size:25px;line-height:1.5;margin:12px 0 18px;font-family:Jua;word-break:keep-all}
.qtext b{color:var(--c);font-weight:400}
.pic{font-size:78px;line-height:1.1;text-align:center;margin:4px 0 10px}
.emo{font-size:36px;letter-spacing:3px;line-height:1.5;text-align:center;margin-bottom:8px}
.passage{background:#FFF8EE;border-radius:16px;padding:14px 18px;font-family:'Gowun Dodum';font-size:20px;line-height:1.85;margin-bottom:12px;font-weight:700}
.seq{font-size:32px;text-align:center;letter-spacing:1px;margin:6px 0 10px;font-family:Jua}
.steps{display:grid;gap:6px;margin:8px 0 12px;font-family:'Gowun Dodum';font-size:20px;font-weight:700}
.steps div{background:#FFF8EE;border-radius:12px;padding:8px 14px}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch button .cn{position:absolute;left:10px;top:8px;font-family:Jua;font-size:13px;color:#A79F8F;background:#fff;border-radius:99px;width:20px;height:20px;line-height:20px;text-align:center}
.ch button{position:relative;min-height:76px;border-radius:18px;background:#FBF7F1;border:3px solid #EFE6D8;font-size:25px;padding:10px;word-break:keep-all;line-height:1.3}
.ch.long{grid-template-columns:1fr}
.ch.bigch button{font-size:40px;min-height:90px}
.ch.long button{font-size:19px;font-family:'Gowun Dodum';font-weight:700;min-height:58px;text-align:left;padding:12px 18px 12px 40px}
.ch.long button .cn{top:50%;transform:translateY(-50%)}
.ch button:not([disabled]):hover{border-color:var(--c)}
.ch button.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
.ch button.ok{border-color:var(--good);background:#E2F6EC;opacity:1}
.ch button.no{border-color:var(--low);background:#FDE6EA;opacity:1}
.ch button[disabled]{opacity:.55}
.ch button.gone{opacity:.15;filter:grayscale(1)}
.ch button.no{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px;font-size:17px}
.fb.ok{background:#E2F6EC}.fb.no{background:#FFF1DC}
.fb b{font-family:Jua;font-size:20px;font-weight:400;display:block;margin-bottom:2px}
.speak{background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--ink);border-radius:12px;padding:5px 12px;font-size:15px;margin-left:auto}
.nextrow{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.svgc{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.score{font-family:Jua;font-size:42px;color:var(--c);line-height:1}
.st{font-size:13px;padding:3px 10px;border-radius:99px;color:#fff;font-family:Jua;white-space:nowrap}
.st.g{background:var(--good)}.st.m{background:var(--mid)}.st.l{background:var(--low)}
.skr{display:grid;grid-template-columns:110px 1fr 74px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.skr .v{text-align:right}
.book{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;align-items:flex-start}
.book .bi{width:42px;height:54px;border-radius:6px 10px 10px 6px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:20px;flex:none;box-shadow:inset 4px 0 0 rgba(0,0,0,.12)}
.book h4{margin:0;font-size:18px;line-height:1.3}
.book p{margin:3px 0;font-size:14px;color:var(--muted)}
.book a{font-size:13px}
.tip{border-left:4px solid var(--c);padding:10px 14px;background:#fff;border-radius:0 14px 14px 0;margin:8px 0;box-shadow:var(--shadow)}
.tip b{font-family:Jua;font-weight:400;color:var(--c)}
.note{font-size:13px;color:var(--muted)}
.box{background:#FFF3E0;border-radius:18px;padding:16px 18px;margin:0 0 18px}
.box ol,.box ul{margin:6px 0 0;padding-left:22px}
.modal-bg{position:fixed;inset:0;background:rgba(40,30,60,.35);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:#fff;border-radius:22px;padding:22px;max-width:460px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:92vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:23px}
label.f{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted)}
input.t,select.t{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font-size:17px;font-family:inherit;background:#fff;color:var(--ink)}
.avas{display:flex;gap:6px;flex-wrap:wrap}
.avas button{font-size:26px;width:46px;height:46px;border-radius:12px;background:#FBF7F1;border:2px solid transparent}
.avas button.on{border-color:var(--ink);background:#fff}
.rub{display:grid;gap:10px;margin:14px 0}
.rub .ri{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#FBF7F1;border-radius:14px;font-size:16px;flex-wrap:wrap}
.seg{display:flex;gap:4px}
.seg button{padding:8px 12px;border-radius:10px;background:#fff;border:2px solid var(--line);font-size:15px}
.seg button.on{background:var(--c);color:#fff;border-color:var(--c)}
.prompt{font-family:Jua;font-size:24px;line-height:1.5;background:#FFF8EE;border-radius:18px;padding:18px;word-break:keep-all}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.day{aspect-ratio:1;border-radius:9px;background:#F1EAE0;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.day.d1{background:#FFE2B0}.day.d2{background:#FFC870}.day.d3{background:#FFA93A;color:#fff}.day.d4{background:#EE8410;color:#fff}.day.d5{background:#D9640A;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-family:Jua;font-size:18px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.flash{background:#fff;border:2px dashed var(--mid);border-radius:18px;padding:14px 18px;margin-bottom:16px;font-family:Jua;font-size:20px}
.sec{margin:30px 0 12px;font-size:23px}
.kchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.kchips button{padding:8px 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-size:16px}
.kchips button.on{border-color:var(--ink)}
.stat{font-family:Jua;font-size:30px;line-height:1.1}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h td,table.h th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.h th{color:var(--muted);font-weight:400}
.foot{max-width:1000px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px}
.coins{display:inline-flex;align-items:center;gap:4px;background:#FFF3C4;border:2px solid #F5D46B;border-radius:99px;padding:4px 14px;font-family:Jua;font-size:20px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.pk{background:#fff;border-radius:28px;padding:26px 18px;border:3px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.pk:hover{transform:translateY(-4px) rotate(-1deg);border-color:#F5D46B}
.pk .pa{font-size:84px;line-height:1}
.pk .pn{font-family:Jua;font-size:30px}
.pk .pc{font-size:15px;color:var(--muted);font-family:'Gowun Dodum'}
.room{position:relative;width:100%;aspect-ratio:16/10;border-radius:26px;overflow:hidden;box-shadow:0 10px 30px rgba(60,40,20,.12);border:4px solid #fff;container-type:inline-size;background:#FFF1DC}
.room .wall{position:absolute;left:0;right:0;top:0;height:66%}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,#E9CBA2 0 7%,#E3C298 7% 14%);border-top:.9cqw solid #D3AC7B}
.wp-w0{background:#FFF1DC}
.wp-w1{background:repeating-linear-gradient(90deg,#DCEBFF 0 3%,#EEF5FF 3% 6%)}
.wp-w2{background:radial-gradient(circle,#FFB9D0 22%,transparent 24%) 0 0/5% 8%,#FFE6EF}
.wp-w3{background:radial-gradient(circle,#fff 7%,transparent 9%) 0 0/7% 11%,radial-gradient(circle,#FFE38A 5%,transparent 7%) 3% 5%/9% 14%,#2C3270}
.wp-w4{background:repeating-linear-gradient(90deg,#D6F0D9 0 4%,#E6F7E8 4% 8%)}
.wp-w5{background:repeating-linear-gradient(0deg,rgba(255,200,60,.25) 0 5%,transparent 5% 10%),repeating-linear-gradient(90deg,rgba(255,200,60,.25) 0 3%,transparent 3% 6%),#FFF8DA}
.wp-w6{background:radial-gradient(circle,#C9A8FF 20%,transparent 22%) 0 0/6% 9%,#F1E8FF}
.sw{width:100%;height:70px;border-radius:14px;border:2px solid var(--line)}
.rug{position:absolute;left:30%;width:40%;top:83%;height:14%;border-radius:50%;background:#F4D9B0;border:.5cqw dashed #E7C08B}
.rug-r1{background:radial-gradient(ellipse,#fff 18%,#FFE27A 19% 32%,#9EE6A6 33% 46%,#8FCBFF 47% 60%,#C7A6FF 61% 74%,#FFA3B5 75%);border:none}
.rug-r2{border-radius:2cqw;background:linear-gradient(transparent 46%,#fff 46% 54%,transparent 54%) 0 0/8% 100%,#5B6170;background-repeat:repeat-x;border:.5cqw solid #3F4452}
.rug-r3{background:#E6F3FF;border:.6cqw solid #fff;box-shadow:0 0 0 .4cqw #BFE0FF}
.rug-r4{background:radial-gradient(circle,#FF8FAE 18%,transparent 20%) 0 0/12% 30%,#FFD9E4;border:none}
.win{position:absolute;left:4%;top:8%;width:22%;height:34%;border:1.1cqw solid #fff;border-radius:1.4cqw;box-shadow:0 0 0 .3cqw #E3D3BC;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-around;font-size:4.2cqw;padding-bottom:1cqw}
.win:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:.6cqw;background:#fff;transform:translateX(-50%)}
.win.v-v0{background:linear-gradient(#8FD0FF,#DDF2FF)}.win.v-v1{background:linear-gradient(#9AD6FF 0 55%,#2E8BD8 55%)}.win.v-v2{background:linear-gradient(#141A4A,#36407E)}.win.v-v3{background:radial-gradient(circle at 30% 30%,#3a2f7a,#090a24)}.win.v-v4{background:linear-gradient(#BFE8FF 0 50%,#5FB36B 50%)}.win.v-v5{background:linear-gradient(#C9DDF0,#F4F8FC)}.win.v-v6{background:linear-gradient(#FFC6DD,#FFE9C9)}
.board{position:absolute;height:1.1cqw;background:#B9875A;border-radius:.4cqw;box-shadow:0 .5cqw 0 rgba(0,0,0,.08)}
.it{position:absolute;transform:translate(-50%,-100%);line-height:1;font-size:4.4cqw;text-align:center;white-space:nowrap}
.it svg{width:5.6cqw;height:5.6cqw;display:block}
.it.big{font-size:6.5cqw}
.tank{display:inline-flex;align-items:center;justify-content:center;gap:.3em;width:2.4em;height:1.6em;background:linear-gradient(#BDE9FF,#6EC6F5);border:.12em solid #fff;border-radius:.25em;box-shadow:0 .1em 0 #A97749;font-size:.6em}.tank small{font-size:.6em}
.bed{position:absolute;left:2%;top:63%;width:27%;height:27%}
.bed .hb{position:absolute;left:0;top:0;width:12%;height:100%;background:#C98F5E;border-radius:1cqw 1cqw 0 0}
.bed .mt{position:absolute;left:8%;right:0;top:38%;height:42%;background:#fff;border-radius:1cqw;box-shadow:inset 0 -1cqw 0 #E8E2F3}
.bed .bl{position:absolute;left:38%;right:0;top:36%;height:46%;background:#8EC5FF;border-radius:1cqw}
.bed .pl{position:absolute;left:12%;top:26%;width:22%;height:24%;background:#fff;border-radius:1.2cqw;border:.3cqw solid #EDE7F5}
.bed .lg{position:absolute;bottom:0;width:6%;height:22%;background:#B07A4C}
.desk{position:absolute;left:35%;width:32%;top:66%;height:17%}
.desk .tp{position:absolute;left:0;right:0;top:0;height:16%;background:#C99467;border-radius:.6cqw}
.desk .lg{position:absolute;top:14%;bottom:0;width:6%;background:#A97749}
.chalk{position:absolute;left:33%;top:28%;width:25%;height:25%;background:#2E6B4F;border:.9cqw solid #B9875A;border-radius:.8cqw;color:#fff;font-family:Jua;font-size:3cqw;display:grid;place-items:center;cursor:pointer;padding:0}
.pot{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pot .pl2{font-size:6cqw;line-height:1}
.pot .ps{width:6cqw;height:4.5cqw;background:#D9764A;clip-path:polygon(0 0,100% 0,85% 100%,15% 100%);margin-top:-.6cqw}
.obj{position:absolute;transform:translate(-50%,-100%);cursor:pointer;line-height:1;padding:0;border-radius:1cqw}
.obj .oi{font-size:5.4cqw;display:block}
.tag{position:absolute;left:50%;top:100%;transform:translate(-50%,.6cqw);background:var(--c);color:#fff;font-family:Jua;font-size:max(11px,1.7cqw);padding:.3cqw 1.1cqw;border-radius:99px;white-space:nowrap;pointer-events:none}
.chalk .tag{top:auto;bottom:-2.6cqw}
.todo .oi,.chalk.todo{animation:bob 1.6s ease-in-out infinite}
.todo:before{content:"";position:absolute;inset:-1.2cqw;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%);animation:glow 1.6s ease-in-out infinite;pointer-events:none}
.chalk.todo:before{border-radius:1cqw}
.okb{position:absolute;right:-1.2cqw;top:-1.2cqw;background:var(--good);color:#fff;border-radius:50%;width:2.6cqw;height:2.6cqw;min-width:16px;min-height:16px;display:grid;place-items:center;font-size:max(10px,1.5cqw);font-family:Jua}
@container (max-width:560px){.obj .tag,.chalk .tag{display:none}.okb{min-width:12px;min-height:12px;font-size:8px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.8cqw)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.quests{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.qst{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;font-family:Jua;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:2px}
.qst .i{font-size:28px}
.qst.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}
.qst small{font-family:'Gowun Dodum';font-size:12px;color:var(--muted)}
.roomhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.roomhead h1{margin:0;font-size:28px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.confetti span{position:absolute;top:-8%;font-size:3.6cqw;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(120cqw) rotate(540deg);opacity:.2}}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sc{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sc .ico{font-size:50px;line-height:1.1;height:62px;display:grid;place-items:center}
.sc .ico svg{width:62px;height:62px}
.sc .n{font-family:Jua;font-size:17px}
.sc.own{border-color:#CDE9D8}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{padding:8px 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-size:16px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.trg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tr{background:#FFF8EE;border-radius:16px;padding:12px 8px;text-align:center}

.map svg{position:absolute;inset:0;width:100%;height:100%}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hashStr(s){var h=1779033703^s.length;for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function rngFrom(seed){var a=hashStr(String(seed));return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ri(r,a,b){return a+Math.floor(r()*(b-a+1));}
function pick(r,arr){return arr[Math.floor(r()*arr.length)];}
function shuffle(r,arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dec(ch){var c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return null;return{cho:Math.floor(c/588),jung:Math.floor((c%588)/28),jong:c%28};}
function comp(cho,jung,jong){return String.fromCharCode(0xAC00+(cho*21+jung)*28+jong);}
function hasB(w){var d=dec(w[w.length-1]);return d?d.jong>0:false;}
function anyB(w){return w.split('').some(function(ch){var d=dec(ch);return d&&d.jong>0;});}
function jo(w,a,b){return w+(hasB(w)?a:b);}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return dstr(new Date());}
function strip(h){return String(h).replace(/<\/?b>/g,'').replace(/<svg[\s\S]*?<\/svg>/g,' ').replace(/<[^>]+>/g,' ').replace(/\p{Extended_Pictographic}|️|‍/gu,'').replace(/\s+/g,' ').trim();}
function uniq(arr,ex){var out=[];arr.forEach(function(x){if(x!==ex&&out.indexOf(x)<0)out.push(x);});return out;}
function mk(r,subj,skill,q,correct,wrongs,o){var w=uniq(wrongs,correct).slice(0,3);if(w.length<3&&/^\d+$/.test(String(correct))){numW(r,+correct,0).forEach(function(x){if(w.length<3&&w.indexOf(String(x))<0)w.push(String(x));});}var all=shuffle(r,[correct].concat(w));var res={subj:subj,skill:skill,q:q,choices:all,ans:all.indexOf(correct)};if(o)for(var k in o)res[k]=o[k];return res;}
function numW(r,ans,lo,hi){var c=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+3];if(ans>=10){var rv=+String(ans).split('').reverse().join('');c.push(rv);}c=shuffle(r,c).filter(function(x){return x!==ans&&x>=(lo==null?0:lo)&&(hi==null||x<=hi);});var out=uniq(c,ans).slice(0,3);var k=4;while(out.length<3){var x=ans+k;if(out.indexOf(x)<0&&(hi==null||x<=hi))out.push(x);else if(ans-k>=0&&out.indexOf(ans-k)<0)out.push(ans-k);k++;}return out;}
function nm(r,ans,lo,hi,unit){unit=unit||'';return{c:ans+unit,w:numW(r,ans,lo,hi).map(function(x){return x+unit;})};}
